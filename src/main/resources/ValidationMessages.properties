validation.plan-code.not-blank=planCode is required and must not be blank
validation.station-id.not-null=stationId is required
validation.sampling-window-start-date.not-null=samplingWindowStartDate is required
validation.sampling-window-end-date.not-null=samplingWindowEndDate is required
validation.sampling-window.end-after-start=samplingWindowEndDate must be after samplingWindowStartDate
validation.sample-volume-quantity.not-null=sampleVolumeQuantity is required
validation.sample-volume-quantity.positive=sampleVolumeQuantity must be greater than 0
validation.sample-volume-unit.not-blank=sampleVolumeUnit is required and must not be blank
validation.priority-level.not-null=priorityLevel is required
validation.priority-level.range=priorityLevel must be between 1 and 5
validation.status.invalid=status must be one of PENDING, APPROVED, COMPLETED or CANCELLED
validation.status.not-null=status must not be null when it is sent
