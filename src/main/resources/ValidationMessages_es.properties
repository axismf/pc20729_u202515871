validation.plan-code.not-blank=planCode es obligatorio y no debe estar en blanco
validation.station-id.not-null=stationId es obligatorio
validation.sampling-window-start-date.not-null=samplingWindowStartDate es obligatorio
validation.sampling-window-end-date.not-null=samplingWindowEndDate es obligatorio
validation.sampling-window.end-after-start=samplingWindowEndDate debe ser posterior a samplingWindowStartDate
validation.sample-volume-quantity.not-null=sampleVolumeQuantity es obligatorio
validation.sample-volume-quantity.positive=sampleVolumeQuantity debe ser mayor que 0
validation.sample-volume-unit.not-blank=sampleVolumeUnit es obligatorio y no debe estar en blanco
validation.priority-level.not-null=priorityLevel es obligatorio
validation.priority-level.range=priorityLevel debe estar entre 1 y 5
validation.status.invalid=status debe ser PENDING, APPROVED, COMPLETED o CANCELLED
validation.status.not-null=status no debe ser null cuando se envía
